<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Briscola Chiamata · 5 Players</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f1dc;background:#102c26}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:18px}h1{margin:12px 0 3px;font-size:2rem;color:#ffdb87}.muted{color:#b9c9bd}.panel{background:#1c4036;border:1px solid #406958;border-radius:16px;padding:18px;margin:16px 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}input,button,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #799b86}input{background:#f9f5e8;color:#172e27;min-width:0}button{background:#e4b95c;color:#172e27;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.ghost{background:#31594a;color:white}.seat{background:#2c5145;border-radius:12px;padding:10px;min-width:145px;flex:1}.active{outline:3px solid #f4c45f}.tag{display:inline-block;background:#e4b95c;color:#172e27;border-radius:30px;padding:4px 9px;font-weight:700}.cards{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.card{width:74px;min-height:108px;border-radius:10px;border:2px solid #d3c8ac;background:#fff9e9;color:#20251f;padding:8px 4px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;align-items:center;box-shadow:0 3px 6px #0003}.card{position:relative;border:3px double #b99b67;background:linear-gradient(140deg,#fffaf0,#f4e4c4);font-family:Georgia,serif}.card:before{content:"✦";position:absolute;top:3px;right:5px;font-size:10px;color:#a68245}.card:after{content:"❧";position:absolute;bottom:3px;left:5px;font-size:11px;color:#a68245}.card strong{font-size:25px}.card small{font-size:11px}.card .symbol{font-size:31px;text-shadow:1px 1px #d4c6a0}.card.suns{color:#a56b00}.card.cups{color:#b43f48}.card.swords{color:#285e9e}.card.bats{color:#277447}button.card:hover:not(:disabled){transform:translateY(-7px);border-color:#f0ba42}.played{min-width:115px;text-align:center}.played .card{margin:7px auto}.hidden{display:none}#message{color:#ffd08b;font-weight:bold}#log{font-size:13px;max-height:160px;overflow:auto}.score{font-size:22px;font-weight:800}.suitBtn{min-width:130px}a{color:#ffe2a0}@media(max-width:550px){main{padding:10px}.panel{padding:12px}.card{width:62px;min-height:93px}.card strong{font-size:21px}.card .symbol{font-size:22px}.seat{min-width:115px;font-size:13px}}</style></head><body><main><h1>🃏 Briscola Chiamata</h1><div class="muted">Five friends. One Brisk. One secret teammate.</div><p id="message"></p><section id="joinPanel" class="panel"><h2>Join a table</h2><div class="row"><input id="name" placeholder="Your name" maxlength="20"><input id="code" placeholder="Room code (blank = create)" maxlength="8"><button id="join">Create / Join</button></div><p class="muted">Create a room, then share its code with four friends. Everyone needs their own browser.</p></section><section id="game" class="hidden"><div class="panel"><div class="row"><h2 style="margin-right:auto">Room <span id="roomCode"></span></h2><button id="copy" class="ghost">Copy invite link</button></div><div id="status" class="muted"></div><div id="seats" class="row" style="margin-top:14px"></div><div id="controls" style="margin-top:14px"></div></div><section id="tablePanel" class="panel hidden"><h2>Table</h2><div id="table" class="row"></div></section><section id="handPanel" class="panel hidden"><h2>Your cards <span id="cardCount" class="muted"></span></h2><div id="hand" class="cards"></div></section><section class="panel"><h3>Game log</h3><div id="log"></div></section></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id),symbols={Suns:'☀️',Cups:'🏆',Bats:'🪵',Swords:'⚔️'},ranks={A:'Ace','3':'Three',K:'King',H:'Horse',Q:'Queen','7':'7','6':'6','5':'5','4':'4','2':'2'};let state=null;const query=new URLSearchParams(location.search);if(query.get('room'))$('code').value=query.get('room');
function msg(t){$('message').textContent=t;setTimeout(()=>{if($('message').textContent===t)$('message').textContent=''},5500)}
$('join').onclick=()=>socket.emit('join',{name:$('name').value,code:$('code').value});$('copy').onclick=()=>navigator.clipboard.writeText(location.origin+'/?room='+state.code).then(()=>msg('Invite link copied!')).catch(()=>msg('Share this room code: '+state.code));socket.on('errorMessage',msg);socket.on('joined',code=>{history.replaceState(null,'','?room='+code);$('joinPanel').classList.add('hidden');$('game').classList.remove('hidden')});socket.on('disconnect',()=>msg('Connection lost. Refresh may require a new room.'));
function cardNode(c,clickable){const el=document.createElement(clickable?'button':'div');el.className='card '+c.suit.toLowerCase();el.innerHTML='<strong>'+c.rank+'</strong><span class="symbol">'+symbols[c.suit]+'</span><small>'+c.suit+'</small>';if(clickable){el.disabled=state.phase!=='play'||state.turn!==state.mySeat;el.onclick=()=>socket.emit('play',c.suit+'-'+c.rank)}return el;}
function btn(text,fn,cls=''){let b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b;}
function render(s){state=s;$('roomCode').textContent=s.code;const names=s.players.map(p=>p.name);$('status').textContent=s.phase==='lobby'?'Waiting for '+(5-s.players.length)+' more players':s.phase==='bid'?'Auction · Current bid: '+s.bid:s.phase==='call'?'Caller is choosing the Brisk':s.phase==='play'?'Hand '+(s.round+1)+' of 8 · Brisk: '+s.brisk+' · Called card: '+ranks[s.called.rank]+' of '+s.called.suit:'Game complete';$('seats').replaceChildren();s.players.forEach(p=>{let d=document.createElement('div');d.className='seat'+(s.turn===p.seat?' active':'');d.innerHTML='<b>'+p.name+(p.seat===s.mySeat?' (You)':'')+'</b><div class="muted">'+(p.seat===s.dealer?'Dealer · ':'')+(p.seat===s.caller&&s.phase!=='lobby'?'Caller · ':'')+(s.partnerRevealed&&p.seat===s.partner?'Teammate · ':'')+p.count+' cards'+(!p.connected?' · Disconnected':'')+'</div>';$('seats').append(d)});const controls=$('controls');controls.replaceChildren();if(s.phase==='lobby'){let p=document.createElement('p');p.textContent='Seats: '+s.players.length+'/5. '+(s.mySeat===0?'You are the host.':'Host will start when everyone joins.');controls.append(p);if(s.mySeat===0)controls.append(btn('Deal cards',()=>socket.emit('start'),''));controls.lastChild.disabled=s.mySeat===0&&!s.canStart;}
if(s.phase==='bid'){let p=document.createElement('p');p.textContent='Turn: '+names[s.turn]+'. '+names[s.caller]+' currently leads at '+s.bid+'.';controls.append(p);if(s.turn===s.mySeat){let input=document.createElement('input');input.type='number';input.min=s.bid+1;input.max=120;input.value=s.bid+1;input.style.width='100px';controls.append(input,btn('Raise bid',()=>socket.emit('bid',{amount:Number(input.value)})),btn('Pass',()=>socket.emit('bid',{pass:true}),'ghost'));}}
if(s.phase==='call'){controls.append(document.createTextNode('Caller: '+names[s.caller]+'. Choose the Brisk. The highest missing card of that suit will be called publicly.'));if(s.caller===s.mySeat){let row=document.createElement('div');row.className='row';row.style.marginTop='12px';for(let suit of Object.keys(symbols))row.append(btn(symbols[suit]+' '+suit,()=>socket.emit('call',suit),'suitBtn'));controls.append(row)}}
if(s.phase==='play'){let p=document.createElement('p');p.innerHTML='<span class="tag">Brisk: '+symbols[s.brisk]+' '+s.brisk+'</span> &nbsp; Called card: <b>'+ranks[s.called.rank]+' of '+s.called.suit+'</b> · Caller: '+names[s.caller]+(s.partnerRevealed?' · Teammate: '+names[s.partner]:' · Teammate hidden');controls.append(p);controls.append(document.createTextNode(s.turn===s.mySeat?'Your turn! Choose any card below.':'Waiting for '+names[s.turn]+' to play.'));}
if(s.phase==='done'){let d=document.createElement('div');d.innerHTML='<p class="score">'+(s.result.success?'Caller team wins!':'Opponents win!')+'</p><p>Caller: '+names[s.result.caller]+' · Teammate: '+names[s.result.partner]+'</p><p>Bid: '+s.result.bid+' · Caller team: '+s.result.team+' points · Opponents: '+s.result.opponents+' points</p>';controls.append(d);if(s.mySeat===0)controls.append(btn('Play another game',()=>socket.emit('again')));}
$('tablePanel').classList.toggle('hidden',s.phase!=='play');$('table').replaceChildren();for(let t of s.table){let d=document.createElement('div');d.className='played';d.textContent=names[t.seat];d.append(cardNode(t.card,false));$('table').append(d)}$('handPanel').classList.toggle('hidden',!['bid','call','play'].includes(s.phase));$('cardCount').textContent='('+s.hand.length+')';$('hand').replaceChildren();for(let c of s.hand)$('hand').append(cardNode(c,true));$('log').replaceChildren();for(let line of [...s.log].reverse()){let p=document.createElement('div');p.textContent='• '+line;$('log').append(p)}}socket.on('state',render);
</script></body></html>
